<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulatore protocolli di rete</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#667;--card:#f4f6fa;--bd:#d5dae3;--data:#1e66d0;--ack:#18854a;--ctl:#7a5cc4;--bad:#d03030;--tm:#c27a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#e6e9ef;--mut:#99a;--card:#1e232c;--bd:#343b48;--data:#5b9bff;--ack:#4cc283;--ctl:#a58cf0;--bad:#ff6b6b;--tm:#f0b04a}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#e6e9ef;--mut:#99a;--card:#1e232c;--bd:#343b48;--data:#5b9bff;--ack:#4cc283;--ctl:#a58cf0;--bad:#ff6b6b;--tm:#f0b04a}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:12px}
h1{font-size:20px;margin:0 0 10px}h2{font-size:14px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
input,select{font:inherit;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}
button{font:inherit;font-weight:600;padding:9px 18px;margin-top:10px;border:0;border-radius:8px;background:var(--data);color:#fff;cursor:pointer}
#out{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;margin-top:12px}
@media(max-width:760px){#out{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}td{border-bottom:1px solid var(--bd);padding:4px 6px}td:first-child{color:var(--mut)}
.sc{overflow:auto;max-height:78vh;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
pre{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow:auto;max-height:320px;font-size:12px}
svg text{fill:var(--fg)}.ln{font-weight:700;font-size:12px}.ls{stroke:var(--bd);stroke-dasharray:3 4}
.a{stroke-width:1.6;fill:none}.data{stroke:var(--data)}.ack{stroke:var(--ack)}.ctl{stroke:var(--ctl)}.a.lost{stroke:var(--bad);stroke-dasharray:4 3}
.lb{font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px}.tm{font-size:9px;fill:var(--mut)!important}.nt{font-size:10px;fill:var(--tm)!important;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:3px}.nt.to{fill:var(--bad)!important;font-size:11px}
svg .xx{fill:var(--bad);font-weight:700;font-size:14px}
.lg span{margin-right:12px;font-size:12px}.lg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
table{border-collapse:collapse;font-size:12.5px;margin:6px 0}td,th{border:1px solid var(--bd);padding:3px 7px;text-align:left}th{background:var(--card)}
.ed{stroke:var(--mut);stroke-width:2}.rd{fill:var(--tm)}.dot{stroke:var(--bg);stroke-width:1}.dot.data{fill:var(--data)}.dot.ack{fill:var(--ack)}.dot.ctl{fill:var(--ctl)}.dot.lost{fill:var(--bad)}
.dl{font-size:10px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:3px}.dl.d-data{fill:var(--data)}.dl.d-ack{fill:var(--ack)}.dl.d-ctl{fill:var(--ctl)}
</style></head><body>
<h1>Simulatore protocolli di rete</h1>
<div class="grid">
<label>Protocollo<select id="proto">
<option value="http">HTTP (TCP, opz. proxy/cache)</option><option value="tcp">TCP (handshake + dati + chiusura)</option><option value="udp">UDP</option>
<option value="gbn">Go-Back-N</option><option value="sr">Selective Repeat</option><option value="dns">DNS</option><option value="smtp">SMTP</option><option value="pop3">POP3</option></select></label>
<label>Banda R (Mbit/s, opz.)<input id="R" type="number" value="100"></label>
<label>RTT (ms, opz.)<input id="rtt" type="number" value="10"></label>
<label>Distanza (km, se manca RTT)<input id="dist" type="number"></label>
<label>Velocità propagazione (km/s)<input id="spd" type="number" value="200000"></label>
<label>MSS / payload (B)<input id="mss" type="number" value="1000"></label>
<label>MTU (B, opz. → ricava MSS)<input id="mtu" type="number"></label>
<label>Header per pacchetto (B)<input id="hdr" type="number" placeholder="40 (UDP 28)"></label>
<label class="ck"><input id="ovh" type="checkbox" checked>Overhead trascurabile</label>
<label>Timer / timeout (ms)<input id="to" type="number" placeholder="2×RTT"></label>
<label>Pacchetti persi (es. 3, 2.5, SYN, M4)<input id="loss" value="2" placeholder="n. pacchetto, trasf.pkt, SYN"></label>
<label>ACK persi (es. 3, 2.5)<input id="lossA"></label>
<label>Asse del tempo (diagramma)<select id="ax"><option value="e">Per eventi (non in scala, chiaro)</option><option value="c">Compatto (frecce uguali)</option><option value="p">Proporzionale (ms reali)</option></select></label>
<label>Client (nome / IP)<input id="cli" value="Client 10.0.0.2"></label>
<label data-g="data">Dimensione dati (es. 30Kb, 30000)<input id="dsize" value="10000"></label>
<label data-g="w">Finestra N<input id="W" type="number" value="4"></label>
<label data-g="tcp">Numerazione TCP<select id="tn"><option value="s">N. segmento (didattico)</option><option value="b">N. sequenza (byte)</option></select></label>
<label data-g="rt" class="ck"><input id="rtr" type="checkbox">Router intermedio (store-and-forward)</label>
<label data-g="tcp">cwnd iniziale (MSS)<input id="cw" type="number" value="1"></label>
<label data-g="tcp">ssthresh (MSS)<input id="ssth" type="number" value="64"></label>
<label data-g="tcp" class="ck"><input id="reg" type="checkbox">TCP già a regime (CA / cwnd fissa)</label>
<label data-g="http">N. file base<input id="nb" type="number" value="1"></label>
<div id="basew" data-g="http" style="display:contents"></div>
<label data-g="http">N. immagini<input id="ni" type="number" value="2"></label>

<div id="imgw" data-g="http" style="display:contents"></div>

<label data-g="http">Modello trasporto<select id="tm"><option value="s">Semplificato: HS 2 vie</option><option value="t">TCP completo</option></select></label>
<label data-g="http">Connessione<select id="pers"><option value="1">Persistente</option><option value="0">Non persistente</option></select></label>
<label data-g="http">Cookie (vuoto = nessuno)<input id="ck" value="XYZ"></label>
<label data-g="http" class="ck"><input id="px" type="checkbox" checked>Proxy (web cache)</label>
<label data-g="http" class="ck"><input id="hit" type="checkbox" checked>Cache HIT sul proxy</label>
<label data-g="http" class="ck"><input id="vld" type="checkbox" checked>HIT con validazione</label>
<label data-g="dns">Host da risolvere<input id="dh" value="www.ebay.com"></label>
<label data-g="dns">IP risposta<input id="dip" value="93.184.216.34"></label>
<label data-g="dns">IP TLD<input id="ipt" value="192.32.1.1"></label><label data-g="dns">IP autoritativo<input id="ipa" value="192.32.4.1"></label><label data-g="dns" class="ck"><input id="dh2" type="checkbox">Dopo il DNS: richiesta HTTP</label>
<label data-g="dns">Query<select id="drec"><option value="i">Iterativa</option><option value="r">Ricorsiva</option></select></label>
<label data-g="dns" class="ck"><input id="dc" type="checkbox">Già in cache nel DNS locale</label>
<label data-g="mail">Mittente / utente<input id="mf" value="alice@a.it"></label>
<label data-g="mail">Destinatario<input id="mt" value="bob@b.it"></label>
<label data-g="mail" class="ck"><input id="mail_simp" type="checkbox">Trasporto dati sempl. (senza ACK)</label>
</div>
<button id="go">Simula</button><button id="play" style="background:var(--ack)">▶ Anima</button>
<p class="lg"><span><i style="background:var(--data)"></i>dati</span><span><i style="background:var(--ack)"></i>ACK</span><span><i style="background:var(--ctl)"></i>controllo</span><span><i style="background:var(--bad)"></i>perso ✗</span><span style="color:var(--tm)">⏱ timer</span></p>
<h2>Rete</h2><div class="sc" id="net" style="max-height:none"></div>
<div id="dnst"></div>
<div id="out"><div><h2>Calcoli</h2><div id="rep"></div></div><div><h2>Diagramma temporale (ms)</h2><div class="sc" id="dia"></div></div></div>
<h2 id="th">Messaggi HTTP</h2><pre id="tx"></pre>
<script>
const $=i=>document.getElementById(i),sv=i=>$(i).value.trim(),nv=(i,d)=>{const v=parseFloat($(i).value);return isNaN(v)?d:v};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let E,L,S,P,M,T,used,LS,AS,maxT,omit,jar,TX,RF={},NY=110,BEND=0;
const pset=s=>new Set(s.toUpperCase().split(/[\s,;]+/).filter(Boolean).map(x=>/^\d+$/.test(x)?'1.'+x:x));
const lane=n=>{let i=L.indexOf(n);if(i<0){L.push(n);i=L.length-1}return i};
const ttx=b=>Math.max(P.R>0?b*8/(P.R*1e3):0,0.002);
let ANI=[],NP={},raf=0;let LIM=1e9;
const add=(t1,t2,a,b,l,k,x,v,tm,tq,tf,te,bd)=>{maxT=Math.max(maxT,t2);if(E.length<3000&&LIM-->0){if(v){tm=tm??(t1+t2)/2;tq=tq??tm;tf=tf??tm;te=te??t2}E.push({t1,t2,a,b,l,k,x,v,tm,tq,tf,te,bd})}else omit++};
const note=(t,a,l)=>{if(E.length<3000&&LIM>0)E.push({t1:t,t2:t,a,b:a,l,k:'note'})};
const rtr=(ts,x,key,keep)=>{const tm=ts+x+P.d/2,tq=Math.max(tm,RF[key]||0);if(keep)RF[key]=tq+x;return{tm,tq,ta:tq+x+P.d/2}};
const short=l=>{l=l.replace(/^#\d+\s*/,'');if(/^GET modified/.test(l))return'GET mod';if(/^GET/.test(l))return'GET';const m=l.match(/^HTTP\/1\.1 (\d+ \w+)/);if(m)return m[1];return l.length>16?l.slice(0,15)+'…':l};
const G={udp:['data','rt'],tcp:['data','tcp','rt'],gbn:['data','w','rt'],sr:['data','w','rt'],http:['http','tcp','rt'],dns:['dns','rt'],smtp:['data','tcp','mail','rt'],pop3:['data','tcp','mail','rt']};
function parseSz(s){s=String(s).trim().toLowerCase().replace(/\s+/g,'');const m=s.match(/^([\d.,]+)(b|kb|k|mb|m|gb|g)?$/);if(!m)return 0;let n=m[1];
 if(n.includes('.')&&n.includes(','))n=n.replace(/\./g,'').replace(',','.');
 else if(/^\d{1,3}(\.\d{3})+$/.test(n)||/^\d{1,3}(,\d{3})+$/.test(n))n=n.replace(/[.,]/g,'');
 else n=n.replace(',','.');
 return Math.round(parseFloat(n)*({k:1024,kb:1024,m:1048576,mb:1048576,g:1073741824,gb:1073741824}[m[2]]||1))||0}
const parseUrl=(v,dp,dh)=>{v=String(v||'').trim().replace(/^https?:\/\//i,'');const k=v.indexOf('/'),h=(k<0?v:v.slice(0,k))||dh||'www.ebay.com',p=k<0||k==v.length-1?dp:v.slice(k);return{h,p}};
const bsrv=()=>{const e=document.querySelector('.bs');return parseUrl(e&&e.value,'/').h};
function buildBase(){const n=Math.min(10,Math.max(1,nv('nb',1))),box=$('basew'),os=[...box.querySelectorAll('.bw')],ov=[...box.querySelectorAll('.bs')];let ps='12288',pv='www.ebay.com';
 box.innerHTML='';for(let i=0;i<n;i++){const sz=os[i]?os[i].value:ps,sr=ov[i]?ov[i].value:pv;ps=sz;pv=parseUrl(sr,'/').h;
  const l=document.createElement('label');l.innerHTML=`File base ${i+1}: dimensione (es. 12Kb, 12288)<input class="bw" value="${esc(sz)}">`;box.appendChild(l);
  const m=document.createElement('label');m.innerHTML=`File base ${i+1}: server (opz. con percorso)<input class="bs" value="${esc(sr)}" placeholder="www.ebay.com${i?'/base'+(i+1)+'.html':'/index.html'}">`;box.appendChild(m)}}
function buildImgs(){const n=Math.min(30,Math.max(0,nv('ni',0))),box=$('imgw'),os=[...box.querySelectorAll('.iw')],ov=[...box.querySelectorAll('.is2')];let ps='2000',pv=bsrv()+'/img1';
 box.innerHTML='';for(let i=0;i<n;i++){const sz=os[i]?os[i].value:ps,sr=ov[i]?ov[i].value:pv;
  const l=document.createElement('label');l.innerHTML=`Img ${i+1}: dimensione (es. 4Kb, 2Mb, 4096)<input class="iw" value="${esc(sz)}">`;box.appendChild(l);
  const m=document.createElement('label');m.innerHTML=`Img ${i+1}: server (opz. con percorso)<input class="is2" value="${esc(sr)}" placeholder="www.ebay.com/pics/img${i+1}.jpg">`;box.appendChild(m)}}
function vis(){const p=$('proto').value;document.querySelectorAll('[data-g]').forEach(e=>e.hidden=!G[p].includes(e.dataset.g))}

function params(){
 const p=$('proto').value,ovh=$('ovh').checked,h=nv('hdr',NaN),hdr=ovh?0:(isNaN(h)?(p=='udp'?28:40):h);
 let mss=nv('mss',1460);const mtu=nv('mtu',NaN);if(!isNaN(mtu))mss=Math.max(1,mtu-hdr);
 let rtt=nv('rtt',NaN);if(isNaN(rtt)){const d=nv('dist',NaN);rtt=isNaN(d)?40:2*d/nv('spd',200000)*1000}
 const to=nv('to',NaN);
 P={ax:sv('ax'),p,hdr,mss,R:nv('R',0),rtt,d:rtt/2,to:isNaN(to)?Math.max(2*rtt,1):to,W:Math.max(1,nv('W',4)),cw:Math.max(1,nv('cw',1)),ss:nv('ssth',64),reg:$('reg').checked,
 pers:sv('pers')=='1',tm:sv('tm'),val:$('vld').checked,tn:sv('tn'),rt:$('rtr').checked,px:$('px').checked,hit:$('hit').checked,ck:sv('ck'),ds:parseSz($('dsize').value)||30000,
 mail_simp:$('mail_simp')?$('mail_simp').checked:false};
}
const mt=(t,tx)=>P.rt?[t+tx+P.d/2,t+tx+P.d/2,t+P.d/2,t+tx+P.d]:[];
function msg(a,b,txt,t,sz=60,ea){
 const n=++M,tx=ttx(sz),ow0=(P.rt?2:1)*tx+P.d,ks=['M'+n,txt.split(' ')[0].toUpperCase()],l=`#${n} ${txt}`;
 for(let k=0;k<8;k++){
  const ow=ea!=null?Math.max(ow0,ea-t):ow0,key=ks.find(x=>LS.has(x)&&!used.has(x)),lab=k?l+' (rit.)':l;S.wire+=sz;
  if(key){used.add(key);add(t,t+ow,a,b,lab,'ctl',1,P.rt);note(t+P.to,a,'timer scaduto');t+=P.to;continue}
  add(t,t+ow,a,b,lab,'ctl',0,P.rt);return t+ow}
 return t}
const hs=(a,b,t,w)=>{t=msg(a,b,'SYN',t);t=msg(b,a,'SYN-ACK',t);const r=msg(a,b,'ACK',t);return w?r:t+0.01};
const hs2=(a,b,t)=>{t=msg(a,b,'HS',t);return msg(b,a,'HS',t)};
function blk(a,b,by,t0,src,arr){const n=Math.max(1,Math.ceil(by/P.mss));LIM=150;let t=t0,ar=t0,bf,bl;S.tr.push({nm:'blocco senza ACK',n,bytes:by});S.pay+=by;
 for(let i=0;i<n;i++){const s=(i<n-1?P.mss:by-(n-1)*P.mss)+P.hdr,x=ttx(s);S.sent++;S.wire+=s;
  if(src&&src[i]>t)t=src[i];let tm,tq,ta,tf,te;if(P.rt){const r=rtr(t,x,a+'>'+b,1);tm=r.tm;tq=r.tq;ta=r.ta;tf=tm-x;te=ta-x}else ta=t+x+P.d;
  if(arr)arr.push(ta);ar=Math.max(ar,ta);const q={t1:t,tm:tm??ta,tq:tq??ta,t2:ta};if(i==0)bf=q;bl=q;add(t,ta,a,b,`PKT ${i+1}/${n}`,'data',0,P.rt,tm,tq,tf,te,1);t+=x}
 BEND=t;LIM=1e9;E.push({k:'band',a,b,v:P.rt,f:bf,l:bl,n,t1:bf.t1,t2:bl.t2});note(ar,b,n+' pacchetti ricevuti (nessun ACK)');return ar+P.d}
const seq=(a,b,t,st)=>{st.forEach(([d,x])=>{t=d?msg(a,b,x,t):msg(b,a,x,t)});return t};
function arq(a,b,bytes,t0,mode,nm){
 const id=++T,n=Math.max(1,Math.ceil(bytes/P.mss)),d=P.d,rt=P.rt?1:0,tcp=mode=='tcp',sr=mode=='sr',gbn=mode=='gbn';
 const sz=i=>(i<n-1?P.mss:bytes-(n-1)*P.mss)+P.hdr,tx=i=>ttx(sz(i));
 const lb=i=>tcp&&P.tn=='b'?`DATI seq=${i*P.mss+1}`:tcp?`${i+1}`:`PKT ${i+1}`;
 const al=k=>tcp&&P.tn=='b'?`ACK=${k>=n?bytes+1:k*P.mss+1}`:tcp?`ack ${k}`:`ACK ${k}`;
 let cw=P.reg?P.cw:1,ss=P.reg?0:P.ss,una=0,nxt=0,rcv=0,dup=0,fx=0,lf=t0,now=t0,g=0;const got=[],acked=[],ev=[],txc=[],sT=[];
 S.tr.push({nm,n,bytes});S.pay+=bytes;LIM=150;
 const fr=x=>{const k=Math.floor(x+1e-9),f=x-k;if(f<1e-6)return''+k;for(let q=2;q<=12;q++)if(Math.abs(f*q-Math.round(f*q))<1e-6)return`${k}+${Math.round(f*q)}/${q}`;return x.toFixed(2)};
 const wsz=()=>tcp?Math.max(1,Math.floor(cw+1e-9)):P.W;
 const win=()=>{const ak=[];if(sr)for(let i=una;i<nxt;i++)if(acked[i])ak.push(i);if(E.length<3000&&LIM>0)E.push({k:'win',t1:now,t2:now,a,b:a,u:una,w:wsz(),c:tcp?'cwnd = '+fr(cw):'N = '+P.W,n,ak})};
 const snd=i=>{const ts=Math.max(now,lf),rx=txc[i]>0,x=tx(i);txc[i]=(txc[i]||0)+1;lf=ts+x;sT[i]=ts;
  const key=id+'.'+(i+1),lost=LS.has(key)&&!used.has(key);if(lost)used.add(key);
  let tm,tq,ta,tf,te;if(rt){const r=rtr(ts,x,a+'>'+b,!lost);tm=r.tm;tq=r.tq;ta=r.ta;tf=tm-x;te=ta-x}else ta=ts+x+d;
  S.sent++;S.wire+=sz(i);if(rx)S.retx++;
  add(ts,ta,a,b,lb(i)+(rx?' (rit.)':''),'data',lost,rt,tm,tq,tf,te);
  if(lost)return;
  let an;
  if(gbn){
   if(i==rcv){
    rcv++;got[i]=1;
    const buf=[];got.forEach((v,k)=>buf.push(k+1));
    note(ta,b,'buffer RX: '+buf.join(' '));
   } else {
    note(ta,b,`scartato (atteso ${rcv+1})`);
   }
   an=rcv;
   if(!an)return
  }
  else{got[i]=1;if(sr)an=i+1;else{while(got[rcv])rcv++;an=rcv}
   const buf=[];got.forEach((v,k)=>buf.push(k+1));note(ta,b,'buffer RX: '+buf.join(' '))}
  const ak='A'+key,xl=AS.has(key)&&!used.has(ak);if(xl)used.add(ak);
  add(ta,ta+d,b,a,al(an),'ack',xl,rt);ev.push({t:ta+d,an,x:xl})};
 const nt=()=>{let m=1e18,j=una;if(sr){for(let i=una;i<nxt;i++)if(!acked[i]&&sT[i]!=null&&sT[i]+P.to<m){m=sT[i]+P.to;j=i}}else if(una<nxt&&sT[una]!=null)m=sT[una]+P.to;return[m,j]};
 const tryS=()=>{while(nxt<n&&nxt<una+wsz())snd(nxt++)};
 win();
 while(una<n&&g++<20000){
  tryS();ev.sort((p,q)=>p.t-q.t);const e=ev[0],[tm,j]=nt();
  if(e&&e.t<=tm){ev.shift();now=Math.max(now,e.t);if(e.x)continue;
   if(sr){acked[e.an-1]=1;while(acked[una])una++;win()}
   else if(e.an>una){
    if(tcp) {
     for(let k=una;k<e.an;k++) cw+=cw<ss?1:1/Math.floor(cw+1e-9);
    }
    una=e.an;dup=0;fx=0;win()
   }
   else if(tcp&&e.an==una&&una<nxt&&!fx){dup++;note(now,a,'count ack='+dup);
    if(dup==3){ss=Math.max(cw/2,1);cw=ss;note(now,a,'fast retransmit (3 dup)');snd(una);fx=1;win()}}}
  else if(tm<1e17){now=Math.max(now,tm);note(now,a,'timer scaduto'+(sr?' pkt '+(j+1):''));
   if(tcp){ss=Math.max(cw/2,2);cw=1;dup=0;fx=0;snd(una)}
   else if(gbn){for(let i=una;i<nxt;i++)snd(i)}
   else snd(j);
   win()}
  else break}
 LIM=1e9;return now}

function udp(){L=['Client','Server'];const by=P.ds,n=Math.max(1,Math.ceil(by/P.mss));let t=0,lostB=0;S.tr.push({nm:'datagrammi',n,bytes:by});
 for(let i=0;i<n;i++){const s=(i<n-1?P.mss:by-(n-1)*P.mss),x=ttx(s+P.hdr),key='1.'+(i+1),lost=LS.has(key);
