    if(!ei&&!k)g+=`<text x="${Math.max(55,Math.min(305,x))}" y="${y-10}" text-anchor="middle" font-size="10" font-weight="700" style="fill:${col};paint-order:stroke;stroke:var(--card);stroke-width:3px">${s[1]}</text>`}})}
 $('dots').innerHTML=g;
 $('cap').innerHTML=i<0?sc.d+' Premi ▶.':`<b>${i+1}/${sc.s.length}</b> · ${sc.s[i][3]}`;
 document.querySelectorAll('#lst li').forEach((e,j)=>e.className=j==i?'on':'');

function tick(t){raf=0;if(!play)return;const dt=Math.min(t-last,80);last=t;p+=dt*sp/1500;
 if(p>=1.2){if(auto&&i<sc.s.length-1){i++;p=0}else{play=false;p=1.2}}
 render();if(play)raf=requestAnimationFrame(tick)}
